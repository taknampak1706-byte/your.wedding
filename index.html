 st={x:e.clientX,y:e.clientY,ox:o.x,oy:o.y,m:h||'mv',c,a0:Math.atan2(e.clientY-c.y,e.clientX-c.x)*180/Math.PI,r0:o.r||0,d0:Math.hypot(e.clientX-c.x,e.clientY-c.y),s0:(o.type=='text'||o.type=='btn')?(o.size||16):o.w};
 drag=el;try{el.setPointerCapture(e.pointerId)}catch(x){}
 document.querySelectorAll('.el.sel').forEach(x=>{x.classList.remove('sel');x.querySelectorAll('.hnd,.tag').forEach(n=>n.remove())});
 el.classList.add('sel');if(!el.querySelector('.hnd'))el.insertAdjacentHTML('beforeend',HS(o));tab='el';UI()}
function pm(e){if(!drag||!sel)return;const o=sel;
 if(st.m=='rot'){const a=Math.atan2(e.clientY-st.c.y,e.clientX-st.c.x)*180/Math.PI;let r=st.r0+(a-st.a0);r=((r+180)%360+360)%360-180;const q=Math.round(r/15)*15;if(Math.abs(r-q)<4)r=q;o.r=Math.round(r);drag.style.transform=`translateX(-50%) rotate(${o.r}deg)`;const t=drag.querySelector('.tag');if(t)t.textContent=tagTx(o);persist();return}
 if(st.m=='rsz'){const k=Math.hypot(e.clientX-st.c.x,e.clientY-st.c.y)/Math.max(8,st.d0);if(o.type=='text'||o.type=='btn'){o.size=Math.max(8,Math.min(90,Math.round(st.s0*k)));const t=drag.querySelector('.tx,.cb');if(t)t.style.fontSize=`calc(var(--u)*${o.size})`}else{o.w=Math.max(30,Math.min(500,Math.round(st.s0*k)));drag.style.width=`calc(var(--u)*${o.w})`}persist();return}
 const u=uu()*(cov.contains(drag)&&cov.classList.contains('sm')?.6:1);o.x=st.ox+(e.clientX-st.x)/u;o.y=st.oy+(e.clientY-st.y)/u;drag.style.left=`calc(var(--u)*${o.x})`;drag.style.top=`calc(var(--u)*${o.y})`;persist()}
function pu(){if(!drag)return;const m=st&&st.m;drag=null;if(m&&m!='mv'){render();UI()}hFlush()}
[app,cov].forEach(x=>{x.addEventListener('pointerdown',pd);x.addEventListener('pointermove',pm);x.addEventListener('pointerup',pu);x.addEventListener('pointercancel',pu)});
/* ===== Batal dan ulang (undo, redo) ===== */
let HU=[],HR=[],HC=null,HQ='',HT=0;
const sigR=(k,v)=>typeof v==='string'&&v.length>300?v.length+':'+v.slice(0,30)+v.slice(-30):v;
const sig=()=>JSON.stringify(S,sigR);
function cl(o){if(Array.isArray(o))return o.map(cl);if(o&&typeof o==='object'){const r={};for(const k in o)r[k]=cl(o[k]);return r}return o}
function hInit(){HU=[];HR=[];HC=cl(S);HQ=sig();hBtn()}
function hSched(){if(!ed)return;clearTimeout(HT);HT=setTimeout(hFlush,500)}
function hFlush(){clearTimeout(HT);if(!ed||!HC)return;const g=sig();if(g===HQ)return;HU.push(HC);if(HU.length>40)HU.shift();HR=[];HC=cl(S);HQ=g;hBtn()}
function hApply(o){const sid=sel&&sel.id;setS(cl(o));sel=sid?ALL().find(x=>x.id==sid)||null:null;HC=o;HQ=sig();render();UI();hBtn()}
function undo(){hFlush();if(!HU.length)return toast('Tidak ada yang bisa dibatalkan',1500);HR.push(HC);hApply(HU.pop());toast('Dibatalkan',1200)}
function redo(){hFlush();if(!HR.length)return toast('Tidak ada yang bisa diulang',1500);HU.push(HC);hApply(HR.pop());toast('Diulang',1200)}
function hBtn(){const u=$('#undoB'),r=$('#redoB');if(u)u.style.opacity=HU.length?1:.4;if(r)r.style.opacity=HR.length?1:.4}
document.addEventListener('keydown',e=>{if(!ed||!(e.ctrlKey||e.metaKey))return;if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;const k=e.key.toLowerCase();if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}});
/* ===== Pratinjau ===== */
function preview(){if(!ed)return;hFlush();persistNow(true);pv=true;ed=false;hm=false;sel=null;document.body.classList.remove('ed','hm');au.pause();cov.classList.remove('op','sm');cov.style.display='block';render();cover();ui.innerHTML=pvHTML();scrollTo(0,0)}
function pvClose(){if(!pv)return;pv=false;au.pause();try{au.currentTime=0}catch(e){}if(io)io.disconnect();ed=true;document.body.classList.add('ed');cov.classList.remove('op','sm');cov.style.display='none';render();UI()}
/* ===== Mulai ===== */
(async()=>{
fit();addEventListener('resize',fit);
cov.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2d3a2b;font:14px sans-serif">Memuat...</div>';
let tmo=0;const lim=new Promise(r=>{tmo=setTimeout(()=>{NOIDB=true;r()},4000)});
let loc=await Promise.race([idbGet('inv').then(v=>{clearTimeout(tmo);return v}),lim]);
if(!loc){try{const j=lsG('inv');if(j)loc=JSON.parse(j)}catch(e){}}
if(!loc){for(const sl of [slug||'utama','utama']){const d=(await oldGet('draft:'+sl))||(await oldGet('pub:'+sl));if(d&&d.S){loc=d.S;break}}}
const own=!!slug&&lsG('own_'+slug)==='1'&&!!loc;
let base=loc||{},rem=null,bg=0,ts=0;
if(SAVED)base=Object.assign({},base,SAVED);
if(slug&&!own){const c=await idbGet('rm_'+slug);if(c){rem=c;ts=c.ts;bg=1}else{rem=await remote(slug).catch(()=>null);if(rem)idbSet('rm_'+slug,rem)}
  if(rem){base=rem.S;hideRemote=!!rem.hide}}
setS(base);
const hide=hideRemote||(SAVED&&SAVED.hide&&!loc);
can=!hide||own||location.hash=='#edit';
if(!can&&!hide)can=true;
render();cover();ui.innerHTML=fabHTML()+'<input type=file id=f hidden>';
if(slug&&!rem&&!own&&!loc)toast('Undangan tidak ditemukan atau belum dipublikasikan');
if(bg)remote(slug).then(r=>{if(r&&r.ts>ts){idbSet('rm_'+slug,r);if(!ed&&!cov.classList.contains('op')&&cov.style.display!='none'){setS(r.S);hideRemote=r.hide;can=!hideRemote||own||location.hash=='#edit';if(!pv)ui.innerHTML=fabHTML()+'<input type=file id=f hidden>';render();cover()}else if(r.hide!==hideRemote){hideRemote=r.hide;can=!hideRemote||own||location.hash=='#edit';if(!can){const b=document.querySelector('.fab[data-a=edit]');if(b)b.remove()}}}}).catch(()=>{});
})();
